app = "tactical-poc"
primary_region = "fra"

[http_service]
  internal_port = 8020
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[deploy]]
  strategy = "immediate" # one machine only: stop, update, start — no split-brain window

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
